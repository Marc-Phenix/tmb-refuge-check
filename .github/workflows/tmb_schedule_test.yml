name: tmb_schedule_test

# Temporary. Prints one line, so a missing row means GitHub did not fire the timer.
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Print the trigger
        run: echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }} at $(date -u +%H:%M)Z"
